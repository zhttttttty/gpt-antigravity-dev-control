name: Feature request
description: Propose a protocol, automation, provider, or documentation improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - V2 protocol
        - V3 Lite orchestrator
        - Provider adapter
        - Documentation / examples
        - Other
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility / risk
      description: Note schema, Risk Gate, state-machine, or backward-compatibility impact.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install "PyYAML>=6.0,<7"
      - name: Compile Python
        run: |
          python -m compileall .ai/scripts
          python -m compileall .ai/adapters .agents/skills
      - name: Parse YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for p in Path('.').rglob('*.yaml'):
              yaml.safe_load(p.read_text(encoding='utf-8'))
              print('OK', p)
          PY
      - name: CLI smoke checks
        run: |
          python .ai/scripts/control.py status
          python .ai/scripts/control.py --help
      - name: Validate example task against Core Protocol
        run: |
          mkdir -p .ai/tasks/queue
          cp -R examples/minimal-task .ai/tasks/queue/TASK-EXAMPLE
          python .ai/scripts/control.py validate TASK-EXAMPLE
          rm -rf .ai/tasks/queue/TASK-EXAMPLE
      - name: Local delegation regression tests (no provider calls)
        run: python -m unittest discover -s tests -v

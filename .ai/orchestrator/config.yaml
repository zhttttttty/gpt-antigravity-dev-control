schema_version: 1
orchestrator:
  database: .ai/runtime/orchestrator.db
  poll_seconds: 10
  lease_seconds: 1800
  max_workers: 2
  max_attempts: 3
  fail_closed: true
  auto_merge:
    low: true
    medium: false
    high: false
executor:
  provider: antigravity_api
  agent: antigravity-preview-05-2026
  model: gemini-3.7-flash
  api_key_env: GEMINI_API_KEY
  api_revision: 2026-05-20
  background: true
  remote_target: /workspace/repo
  repository_url: auto
  github_pat_env: ANTIGRAVITY_GITHUB_PAT
  allow_public_repo_without_pat: true
reviewer:
  provider: openai_responses
  model: gpt-5.6-sol
  api_key_env: OPENAI_API_KEY
  reasoning_effort: high
  max_evidence_chars: 180000

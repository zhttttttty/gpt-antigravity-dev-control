schema_version: 2
id: TASK-XXX
title: <short title>
status: READY
contract_revision: 1
attempt: 1

# Execution routing in the unified protocol. Older tasks without it remain direct.
execution:
  mode: direct
  adapter: antigravity_cli
  model: configured_default
  context_budget: compact
  report_level: summary
  max_implementation_reworks: 1
  max_infra_retries: 1
  routing_override:
    result: NOT_REQUESTED
    approved_by: null
    evidence: null
  escalation: codex_review

planning:
  milestone: M1
  epic: EPIC-001
  requirements: [FR-001]
  depends_on: []
  risk: medium
  work_type: mechanical
  judgment: medium
  context_continuity: low
  acceptance_determinism: high

roles:
  planner: gpt-5.6-sol
  executor: antigravity
  reviewer: gpt-5.6-luna

objective: >-
  <One clear independently reviewable outcome.>

scope:
  writable:
    - src/example/**
    - tests/example/**
  protected:
    - .ai/project/ARCHITECTURE.md
    - migrations/**
  out_of_scope:
    - <explicit non-goal>

authority:
  architecture_change: false
  database_schema_change: false
  public_api_change: false
  auth_security_change: false
  major_dependency_change: false
  deployment_change: false

isolation:
  worktree: true
  base_branch: main
  branch: ai/TASK-XXX

acceptance:
  - id: AC-001
    criterion: <observable criterion>
    evidence: <test/command/file/behavior>

checks:
  # Put highest-risk counterexamples first, then affected-scope checks, then
  # the full regression/release matrix. At least one required gate is needed.
  adversarial_probes: []
  fast_gate: []
  final_gate: []
  # Legacy schema-v2 tasks may keep all required checks here.
  required: []
  optional: []

risk_controls:
  rollback_plan_required: false
  cross_family_review_required: false
  human_merge_approval_required: false

artifacts:
  brief: brief.md
  context: context.md
  executor_receipt: receipt.executor.yaml
  qa_receipt: receipt.qa.yaml
  review: review.yaml
  rollback: rollback.md

metadata:
  created_at: null
  updated_at: null
  created_by: gpt-5.6-sol

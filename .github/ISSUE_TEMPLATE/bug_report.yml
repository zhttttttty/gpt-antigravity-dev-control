name: Bug report
description: Report a reproducible defect in the protocol or local delegation CLI
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / branch
      placeholder: "main 3.2.0-local"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / evidence
      description: Remove secrets before posting logs or receipts.
  - type: checkboxes
    id: secrets
    attributes:
      label: Secret check
      options:
        - label: I removed API keys, PATs and private credentials from the report.
          required: true

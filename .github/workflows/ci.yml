name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r .ai/orchestrator/requirements.txt
      - name: Compile Python
        run: python -m compileall .ai/scripts .ai/orchestrator
      - name: Parse YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for p in Path('.').rglob('*.yaml'):
              yaml.safe_load(p.read_text(encoding='utf-8'))
              print('OK', p)
          PY
      - name: CLI smoke checks
        run: |
          python .ai/scripts/ai.py status
          python .ai/orchestrator/orchestrator.py --help
      - name: Validate example task against V2 contract
        run: |
          cp -R examples/minimal-task .ai/tasks/queue/TASK-EXAMPLE
          python .ai/scripts/ai.py validate TASK-EXAMPLE
          rm -rf .ai/tasks/queue/TASK-EXAMPLE
